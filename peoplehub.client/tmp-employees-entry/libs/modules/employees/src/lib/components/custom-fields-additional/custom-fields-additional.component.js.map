<div class="bg-white rounded-[16px] border border-[#dbeafe] shadow-[0_4px_10px_rgba(0,0,0,0.05)] transition-shadow duration-200 ease-in p-8 h-full hover:shadow-[0_8px_20px_rgba(0,0,0,0.08)]">
  <div class="grid grid-cols-3 gap-[10px] max-[768px]:grid-cols-1">
    @if (!formConfig.customFieldName.isHide) {
      <ui-text-box
        [id]="formConfig.customFieldName.id"
        [parentFormGroup]="customFieldsAdditional"
        [label]="formConfig.customFieldName.label!"
        [placeholder]="formConfig.customFieldName.placeholder ?? ''"
        [minLength]="formConfig.customFieldName.minLength"
        [maxLength]="formConfig.customFieldName.maxLength"
        [isRequired]="formConfig.customFieldName.isRequired!"
      ></ui-text-box>
    }

    @if (!formConfig.customFieldValue.isHide) {
      <ui-text-box
        [id]="formConfig.customFieldValue.id"
        [parentFormGroup]="customFieldsAdditional"
        [label]="formConfig.customFieldValue.label!"
        [placeholder]="formConfig.customFieldValue.placeholder ?? ''"
        [minLength]="formConfig.customFieldValue.minLength"
        [maxLength]="formConfig.customFieldValue.maxLength"
        [isRequired]="formConfig.customFieldValue.isRequired!"
      ></ui-text-box>
    }

    <div></div>
  </div>

  @if (!formConfig.additionalInformation.isHide) {
    <div class="mt-5">
      <ui-text-area
        [id]="formConfig.additionalInformation.id"
        [parentFormGroup]="customFieldsAdditional"
        [label]="formConfig.additionalInformation.label!"
        [placeholder]="formConfig.additionalInformation.placeholder ?? ''"
        [maxLength]="formConfig.additionalInformation.maxLength"
        [isRequired]="formConfig.additionalInformation.isRequired!"
      ></ui-text-area>
    </div>
  }
</div>
