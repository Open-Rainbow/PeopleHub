<div class="fixed inset-0 flex items-center justify-center bg-black/15 z-[9999]"> 
<div class="relative w-[70px] h-[70px] flex items-center justify-center">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDtV5o8uP07w1WZBt1RhCfk6qtv37V3HpzkQ&s"
    class="w-[45px] h-[45px] z-[2] rounded-full" />


  <div class="absolute inset-0 rounded-full border-[4px] border-[#0c2d6b]
              [mask:conic-gradient(transparent_0deg_90deg,black_90deg_170deg,transparent_170deg_250deg,black_250deg_360deg)]
              [-webkit-mask:conic-gradient(transparent_0deg_90deg,black_90deg_170deg,transparent_170deg_250deg,black_250deg_360deg)]
              animate-spin"></div>
  <div class="absolute inset-0 rounded-full border-[4px] border-[#0c2d6b]
              [mask:conic-gradient(transparent_0deg_90deg,black_90deg_170deg,transparent_170deg_250deg,black_250deg_360deg)]
              [-webkit-mask:conic-gradient(transparent_0deg_90deg,black_90deg_170deg,transparent_170deg_250deg,black_250deg_360deg)]
              animate-spinGap"></div>
</div>
</div>
