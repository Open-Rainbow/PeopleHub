@if (visible) {
  <div
    (mouseenter)="pauseTimer()"
    (mouseleave)="resumeTimer()"
    class="ui-toast"
    [ngClass]="getPositionClasses()"
    [class.ui-toast--normal]="type === 'normal'"
    [class.ui-toast--warning]="type === 'warning'"
    [class.ui-toast--alert]="type === 'alert'"
    [class.ui-toast--success]="type === 'success'"
    role="status"
    [attr.aria-live]="type === 'alert' || type === 'warning' ? 'assertive' : 'polite'"
    [attr.aria-label]="title + ' ' + subtitle"
  >
    <div class="ui-toast__content">
      <ui-icon class="ui-toast__icon" [name]="icon"></ui-icon>

      <div class="ui-toast__message">
        <div class="ui-toast__title">{{ title }}</div>
        <div class="ui-toast__subtitle">{{ subtitle }}</div>
      </div>
    </div>

    <button
      class="ui-toast__close"
      (click)="closeToast()"
      aria-label="Close notification"
      type="button"
    >
      <ui-icon name="mdi:multiply"></ui-icon>
    </button>

    <div
      class="ui-toast__progress"
      role="progressbar"
      [attr.aria-valuenow]="progress"
      aria-valuemin="0"
      aria-valuemax="100"
      [attr.aria-label]="'Progress: ' + (100 - progress) + '% complete'"
    >
      <div class="ui-toast__progress-bar" [style.width.%]="progress"></div>
    </div>
  </div>
}
