

<div class="flex items-center justify-center gap-6">

  <div class="chart-container">
    <canvas #chartCanvas width="216" height="216" (mouseleave)="resetChart()"></canvas>
  </div>

  @if (showLegends) {
    <div class="flex flex-col justify-center text-gray-600 text-sm min-w-[160px] font-sans">

      @for (item of legendData; let i = $index; track item) {
        <div
          class="flex items-center justify-between gap-2.5 px-3 py-2 rounded-lg transition-opacity duration-200 text-[12px]"
          (mouseenter)="onLegendHover(i)"
          (mouseleave)="onLegendLeave()"
          [class.opacity-40]="activeIndex !== null && activeIndex !== i"
          [class.bg-gray-100]="activeIndex === i"
        >
          <div class="flex items-center gap-2.5">
            <span class="w-3 h-3 rounded-full shrink-0"
                  [style.background]="item.color"></span>

            <span class="text-gray-700" >
              {{ item.label }}
            </span>
          </div>

          <span class="font-semibold"
                [style.color]="item.color">
            {{ getDisplayValue(i) }}
          </span>
        </div>
      }

    </div>
  }
</div>
