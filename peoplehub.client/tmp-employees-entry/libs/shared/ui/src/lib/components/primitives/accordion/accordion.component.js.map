<div [class]="'ui-accordion ui-accordion--' + variant">
  <div
    [id]="'accordion-header-' + sectionId"
    class="ui-accordion__header"
    [class.ui-accordion__header--active]="isAccordionOpen()"
    role="button"
    [attr.aria-expanded]="isAccordionOpen()"
    [attr.aria-controls]="'accordion-content-' + sectionId"
    tabindex="0"
    (click)="toggleSection()"
    (keydown)="onKeyDown($event)"
  >
    <div class="ui-accordion__header-content">
      @if (icon && variant === 'with-icon') {
        <div class="ui-accordion__icon" [attr.aria-hidden]="true">
          <ui-icon [name]="icon"></ui-icon>
        </div>
      }
      <div class="ui-accordion__title-group">
        <span class="ui-accordion__title">{{ title }}</span>
        @if (subtitle) {
          <span class="ui-accordion__subtitle">{{ subtitle }}</span>
        }
      </div>
    </div>

    <div class="ui-accordion__controls">
      @if (showEditButton && variant !== 'flush') {
        <span
          class="ui-accordion__edit-btn"
          role="button"
          tabindex="-1"
          [attr.aria-label]="'Edit ' + title"
          (click)="onEditClick($event)"
        >
          <ui-icon name="edit" [attr.aria-hidden]="true"></ui-icon>
          <span>Edit</span>
        </span>
      }

      <ui-icon
        class="ui-accordion__toggle-icon"
        [class.ui-accordion__toggle-icon--rotated]="isAccordionOpen()"
        name="material-symbols:keyboard-arrow-down-rounded"
        [attr.aria-hidden]="true"
      ></ui-icon>
    </div>
  </div>

  <div
    #content
    [id]="'accordion-content-' + sectionId"
    class="ui-accordion__content"
    [style.maxHeight]="isAccordionOpen() ? contentHeight + 'px' : '0px'"
    role="region"
    [attr.aria-labelledby]="'accordion-header-' + sectionId"
  >
    <div class="ui-accordion__body">
      <ng-container *ngTemplateOutlet="modalTemplate"></ng-container>
    </div>
  </div>
</div>
