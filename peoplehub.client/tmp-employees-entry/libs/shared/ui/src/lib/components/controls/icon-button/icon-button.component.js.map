<button
  [attr.type]="type()"
  [disabled]="disabled()"
  [class]="buttonClass()"
  [attr.aria-label]="ariaLabel()"
  [attr.title]="title() || ariaLabel()"
  (click)="onButtonClick($event)">
  <span class="ui-icon-button__icon" aria-hidden="true">
    <ui-icon [name]="iconName()"></ui-icon>
  </span>
</button>
