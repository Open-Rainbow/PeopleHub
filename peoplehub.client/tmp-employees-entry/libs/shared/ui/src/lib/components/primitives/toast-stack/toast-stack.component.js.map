<div
  class="fixed z-[9999] flex flex-col gap-3"
  [class.top-4]="position === 'top-right' || position === 'top-left' || position === 'top-center'"
  [class.bottom-4]="position === 'bottom-right' || position === 'bottom-left' || position === 'bottom-center'"
  [class.right-4]="position === 'top-right' || position === 'bottom-right'"
  [class.left-4]="position === 'top-left' || position === 'bottom-left'"
  [class.left-1/2]="position === 'top-center' || position === 'bottom-center'"
  [class.-translate-x-1/2]="position === 'top-center' || position === 'bottom-center'"
>
  @for (toast of toasts; track trackByToastInstance($index, toast)) {
    <ui-toast
      class="transition-all duration-300 ease-in-out"
      [subtitle]="toast.subtitle"
      [type]="toast.type ?? 'normal'"
      [icon]="toast.icon ?? ''"
      [title]="toast.title ?? ''"
      [position]="position"
      [isStacked]="true"
      [duration]="toast.duration ?? 30000"
      (closed)="removeToast(toast.id)"
    >
    </ui-toast>
  }
</div>
