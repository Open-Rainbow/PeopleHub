<div
  class="ui-count-widget"
  [class.ui-count-widget--borderless]="!showBorder"
  [class.ui-count-widget--vertical]="isVertical"
  [class.ui-count-widget--horizontal]="!isVertical"
  [class.ui-count-widget--reverse]="isReverse"
  [style.--cw-border-color]="borderColor"
  [style.--cw-background-color]="backgroundColor"
  role="status"
  [attr.aria-label]="label + ' ' + formattedValue"
>
  <span class="ui-count-widget__label" [style.color]="labelColor" [style.font-size]="labelSize">{{ label }}</span>
  <span class="ui-count-widget__value" [style.color]="valueColor" [style.font-size]="valueSize">{{ formattedValue }}</span>
</div>
