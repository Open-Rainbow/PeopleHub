<label
  class="block font-semibold mb-[10px] text-[#1E293B] !text-[#1E293B] text-left w-[300px]"
>
  {{ label }}
</label>

<div
  class="flex justify-between mb-[30px] w-[300px]"
  [formGroup]="parentFormGroup"
  [class.error]="isInvalid"
>
  @for (digit of otpArray; track $index; let i = $index) {
    <input
      type="text"
      maxlength="1"
      [attr.maxlength]="i === 0 ? otpLength.toString() : '1'"
      (paste)="i === 0 ? handlePaste($event) : null"
      (input)="handleInput($event, i)"
      (keydown)="handleKeyDown($event, i)"
      #otpInput
      class="w-[40px] h-[40px] text-[18px] text-center border border-[#ccc] rounded-[6px] bg-[#f3f0ff] outline-none focus:!border-[#2563eb] focus:shadow-[0_0_0_3px_rgba(37,99,235,0.5)]"
    />
  }
</div>
