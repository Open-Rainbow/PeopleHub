    <!-- App shell: fixed viewport height, only <main> scrolls so sidebar + header never move -->
    <div class="home-layout flex h-dvh w-full overflow-hidden bg-[var(--content-wrapper-bg-color)]">
      <!-- SIDEBAR (owns its own width, background and border) -->
      <sidebar-root
        class="sidebar shrink-0 h-full"
        [isSidebarExpanded]="isSidebarExpanded"
        [hoverEnabled]="isUserCollapsed"
        (hoverEnter)="onSidebarHoverEnter()"
        (hoverLeave)="onSidebarHoverLeave()">
      </sidebar-root>

      <!-- RIGHT: min-w-0 lets this flex column shrink so the header/content never exceed the viewport -->
      <div class="right-layout flex-1 min-w-0 flex flex-col h-full">
        <header-root
          class="shrink-0 z-[2000] w-full"
          [isUserCollapsed]="isUserCollapsed"
          (sidebarToggle)="onSidebarToggleByUser()">
        </header-root>

        <main class="content-area flex-1 min-h-0 min-w-0 p-[32px_48px] overflow-y-auto bg-[#f9fbfd]">
          <router-outlet></router-outlet>
        </main>
      </div>
    </div>
