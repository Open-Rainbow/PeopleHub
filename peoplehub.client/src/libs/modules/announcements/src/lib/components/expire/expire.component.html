<div class="container w-full h-full p-[20px] text-[var(--color-text-primary)]">
  <div
    class="blank-space w-full bg-[var(--color-surface)] rounded-[20px] px-[20px] items-start border border-[var(--color-border)] box-border overflow-hidden transition-all duration-500 ease-in-out"
    [class.visible]="showForm"
  >
    <form [formGroup]="form">
      <ui-text-box
        id="title"
        [parentFormGroup]="form"
        [label]="'Title'"
        [placeholder]="'Enter the title'"
        [isRequired]="true"
      >
      </ui-text-box>
      <div class="inside flex gap-[16px] mb-[18px] mt-[20px] w-full box-border">
        <ui-dropdown
          class="flex-1 min-w-0"
          id="priority"
          [parentFormGroup]="form"
          [label]="'Priority'"
          [placeholder]="'Select severity type'"
          [isRequired]="true"
          [options]="severityOptions$ | async"
        >
        </ui-dropdown>
        <ui-calendar
          class="flex-1 min-w-0"
          id="expiresOn"
          [parentFormGroup]="form"
          [label]="'Expires On'"
        >
        </ui-calendar>
      </div>
      <ui-text-area
        id="description"
        [parentFormGroup]="form"
        [label]="'Description'"
        [placeholder]="'Enter description'"
        [isRequired]="true"
        [showBorder]="true"
      >
      </ui-text-area>
      <div class="footer flex justify-end items-center pr-[2px] pt-[13px] gap-[8px]">
        <ui-text-button
          text="Clear"
          variant="secondary"
        ></ui-text-button>
        <ui-text-button
          text="Save"
        ></ui-text-button>
      </div>
    </form>
  </div>

  <div
    class="blank-space-two w-full h-full mt-[25px] bg-[var(--color-surface)] rounded-[20px] p-[20px] items-start border border-[var(--color-border)] box-border"
  >
    <div
      class="form-header bg-[color-mix(in_srgb,var(--color-primary)_12%,var(--color-surface))] rounded-t-[19px] rounded-b-none px-[13px] py-[10px] mt-[-20px] mx-[-20px] mb-[20px] border-b border-[var(--color-border)] flex flex-row items-center text-[var(--color-primary)]"
    >
      <span class="icon-box">
        <ui-icon [name]="'announcement_outline'"></ui-icon>
      </span>
      <div class="header-text">
        <h3 class="m-0 text-[var(--color-primary)] text-[1.22rem] ml-[8px] mb-[-2px]">
          Expire Announcements
        </h3>
      </div>
    </div>
    @for (announcement of otherAnnouncements; track announcement; let last = $last) {
      <div class="announcement-item">
        <div class="title-row flex items-center gap-[10px]">
          <h4 class="title text-[15px] font-semibold text-[var(--color-text-primary)]">
            {{ announcement.title }}
          </h4>
          <ui-chip
            [text]="announcement.priorityDesc"
            [color]="priorityTone(announcement.priorityDesc)"
            [activeColor]="priorityTone(announcement.priorityDesc)"
            [activeBGColor]="priorityTint(announcement.priorityDesc)"
            [bgColor]="priorityTint(announcement.priorityDesc)"
          >
          </ui-chip>
        </div>
        <p
          class="description text-[14px] text-[var(--color-text-secondary)] my-[10px] mb-[16px] leading-[1.4]"
          [class.truncated]="isTruncated(announcement.description, 50)"
          [directivesTooltip]="isTruncated(announcement.description, 50) ? announcement.description : ''"
          tooltipPosition="top"
          [tooltipBgColor]="'var(--color-text-primary)'"
          [tooltipTextColor]="'var(--color-surface)'"
          [tooltipMaxWidth]="'60'"
        >
          {{ leaveDescription(announcement.description, 50) }}
        </p>
        <div class="footer-row flex justify-between items-center text-[13px] text-[var(--color-text-muted)]">
          <div class="date text-[12px] font-medium flex items-center gap-[4px]">
            <span class="expire-label text-[var(--color-text-primary)]">Expire on:</span>
            <span class="expire-date text-[var(--color-danger)]">
              {{ announcement.expireOn }}
            </span>
          </div>
          <div class="footer flex justify-end items-center gap-[8px]">
            <ui-text-button text="Edit"></ui-text-button>
            <ui-text-button text="Delete" variant="secondary"></ui-text-button>
          </div>
        </div>
      </div>
      @if (!last) {
        <hr class="custom-line border-0 border-t border-[var(--color-border)] my-[30px] opacity-60" />
      }
    }
  </div>
</div>
