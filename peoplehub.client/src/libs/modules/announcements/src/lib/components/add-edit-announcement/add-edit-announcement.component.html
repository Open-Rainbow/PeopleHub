<div
  class="w-full max-w-[980px] mx-auto p-6 bg-white rounded-xl border border-gray-200"
>
  <h2 class="text-2xl font-semibold mb-6">Add Announcement</h2>
  <form [formGroup]="form" class="grid grid-cols-2 gap-4">
    <ui-text-box
      [parentFormGroup]="form"
      id="salutation"
      label="Title"
      placeholder="Announcement title"
      [isRequired]="true"
    ></ui-text-box>
    <ui-calendar
      [parentFormGroup]="form"
      id="date"
      label="Expiry Date"
      [isRequired]="true"
    ></ui-calendar>

    <ui-dropdown
      [parentFormGroup]="form"
      id="priority"
      label="Priority"
      [options]="priorityOptions"
    ></ui-dropdown>
    <ui-dropdown
      [parentFormGroup]="form"
      id="category"
      label="Category"
      [options]="categoryOptions"
    ></ui-dropdown>

    <ui-dropdown
      [parentFormGroup]="form"
      id="department"
      label="Department"
      [options]="departmentOptions"
    ></ui-dropdown>
    <ui-dropdown
      [parentFormGroup]="form"
      id="targetAudience"
      label="Target Audience"
      [options]="audienceOptions"
    ></ui-dropdown>

    <div class="col-span-2">
      <ui-text-area
        [parentFormGroup]="form"
        id="description"
        label="Description"
        placeholder="Write announcement details"
        [isRequired]="true"
      ></ui-text-area>
    </div>

    <div
      class="col-span-2 flex justify-end gap-3 pt-4 border-t border-gray-100"
    >
      <ui-text-button
        text="Clear"
        variant="secondary"
        (buttonClick)="onClear()"
      ></ui-text-button>
      <ui-text-button
        text="Save Announcement"
        (buttonClick)="onSubmit()"
      ></ui-text-button>
    </div>
  </form>
</div>
