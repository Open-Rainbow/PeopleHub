<section class="space-y-4">
  <div class="flex items-center justify-between">
    <h2 class="text-lg font-semibold text-foreground" style="font-size: 14px;">
      Leave Categories
    </h2>

    <div class="flex gap-2">
      <orms-buttonlist [buttons]="buttonData" [selectedId]="selectedCategoryId" [textColor]="'#3b82f6'" [bgColor]="'red'"
        [selectedBgColor]="'#3b82f6'" [selectedTextColor]="'#ffffff'" [hoverTextColor]="'#3b82f6'"
        [hoverBgColor]="'#ffffff'" (buttonClick)="buttonClick($event)">
      </orms-buttonlist>
    </div>
  </div>


  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
    @for(leave of filteredLeaveCards; track leave;){
      <div class="box group relative rounded-xl border-[1.5px] border-border bg-card overflow-hidden
          transition-all duration-300 hover:border-[var(--hover-border)]"
      [style.--hover-border]="leave.color">

      <div class="p-4" style="background-color: white;">


        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5 min-w-0">

            <span class="text-sm font-semibold text-foreground leading-tight truncate" style="font-size: 13px;">
              {{ leave.leaveTypeName }}
            </span>
          </div>

          <div class="flex items-center gap-1 px-2 py-0.5 rounded-md flex-shrink-0" [ngStyle]="{
        backgroundColor: leave.accentColor + '12',
        color: leave.accentColor
      }">
            <span class="text-base font-bold font-mono leading-none" style="font-size: 12px;">
              {{ remaining(leave.total,leave.used) }}
            </span>
            <span class="text-[10px] font-medium opacity-80">
              left
            </span>
          </div>
        </div>

        <ui-progress-bar [parentFormGroup]="leaveBalance" [total]="leave.total" [used]="leave.used"
          [barColor]="leave.color" [remainingTextColor]="'#353d43'" [hideDetails]="true"></ui-progress-bar>

        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 text-xs text-muted-foreground">
            <span>
              <span class="font-semibold font-mono" [style.color]="leave.color">
                {{ leave.used }}
              </span>
              used
            </span>
            <span class="text-border">/</span>
            <span>
              <span class="font-semibold text-foreground font-mono">
                {{ leave.total }}
              </span>
              total
            </span>
          </div>

          <button type="button" (click)="toggleExpanded(leave)" class="flex items-center justify-center w-6 h-6 rounded-full
                hover:bg-gray-200 transition-colors
                text-muted-foreground hover:text-foreground"
            [attr.aria-label]="leave.expanded ? 'Collapse details' : 'Expand details'">
            <ui-icon [name]="'arrow_down'" [ngStyle]="{
      transform: leave.expanded ? 'rotate(180deg)' : 'rotate(0deg)'
    }">
            </ui-icon>



          </button>
        </div>

        <div class="grid transition-all duration-300 ease-out"
          [ngClass]="leave.expanded ? 'grid-rows-[1fr] opacity-100 mt-3' : 'grid-rows-[0fr] opacity-0'">
          <div class="overflow-hidden">
            <div class="pt-3 border-t border-border space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-xs text-muted-foreground">Carry Forward</span>
                <span class="text-xs font-semibold text-foreground font-mono">
                  {{ leave.carryForward }} days
                </span>
              </div>

              <div class="flex items-center justify-between">
                <span class="text-xs text-muted-foreground">Encashable</span>
                <span class="text-xs font-semibold text-foreground font-mono">
                  {{ leave.encashable == 0 ? 'N/A' : leave.encashable }}
                </span>
              </div>

              <button type="button" (click)="onApplyClick(leave)" class="w-full mt-1 py-1.5 text-xs font-medium rounded-lg
                    transition-colors text-primary-foreground"
                [ngStyle]="{ backgroundColor: leave.color, color: 'white' }">
                Apply {{ leave.leaveTypeName }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    }
    
  </div>
</section>
