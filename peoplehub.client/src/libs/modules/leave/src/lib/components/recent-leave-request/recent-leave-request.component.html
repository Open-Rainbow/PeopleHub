<div class="bg-white rounded-[14px] shadow-sm w-full mb-[30px] p-0 overflow-hidden">
  <div class="text-sm font-semibold pt-[10px] px-5 pb-0">Leave History</div>
 

    <div class="mb-4 px-[20px]" style="color: #979292; font-size: 12px;">Recent Leave Request and Status</div>
   <div>
  <app-table
    [tableData]="leaveTableData"
    [showUndoRedo]="false"
    [showCheckbox]="false"
    [showserialNo]="false"
    [alternateRowColor]="true"
    [customRowColor]="'#F9FAFB'"
   
    [bottomPagination]="false"
  >
  </app-table>





</div>

<ng-template #actionMenu let-row="row">
  
  

  <div class="panel-option" 
       style="cursor: pointer; padding: 8px; display: flex; align-items: center; gap: 8px;"
       [appTooltip]="getReason(row)"
       tooltipPosition="left" 
       [tooltipbgColor]="'#333'" 
       [tooltiptextColor]="'#fff'">
    <ui-icon name="mdi:eye-outline" style="font-size: 16px;"></ui-icon> Reason
  </div>
  <div class="panel-option"  (click)="onEdit(row)"style="cursor: pointer; padding: 8px; display: flex; align-items: center; gap: 8px;">
    <ui-icon name="edit" style="font-size: 16px;"></ui-icon> Edit
  </div>
  
  <hr style="margin: 0px 10px;">

  <div class="panel-option" (click)="confirmDelete(row)" style="color: red;  cursor: pointer; padding: 8px; display: flex; align-items: center; gap: 8px;">
    <ui-icon name="delete" style=" font-size: 16px;"></ui-icon>Delete 
  </div>
</ng-template>  
@if(isformOpen){
<orms-model-popup [title]="'Add LeaveRequest'" (close)="closeModal()"
            [innerContent]="deleteform">
</orms-model-popup>
}

            <ng-template #deleteform>
    <div class="confirm-box">
      <div class="flex justify-center">Are you sure you want to delete this leave request?</div>

      <div class="flex flex-row justify-center gap-[25px] my-2.5">
        <ui-icon-text-button (click)="deleteLeave()" [text]="'yes'" ></ui-icon-text-button>
        <ui-icon-text-button (click)="closeModal()" [text]="'Cancel'" ></ui-icon-text-button>
      </div>
    </div>
  </ng-template>
</div>
