<div class="w-full rounded-[20px] py-5 px-[25px] text-[var(--color-text-primary)]">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
    <h2 class="m-0 text-sm font-semibold text-[var(--color-text-primary)]">Leave Balance Overview</h2>
    <div class="w-[110px]">
      <ui-value-select
        id="year"
        [parentFormGroup]="LeaveBalanceOverview"
        [dropdownValues]="yearOptions"
        (onSelect)="onYearSelect($event)"
      ></ui-value-select>
    </div>
  </div>

  <div class="flex items-center justify-center w-full my-[25px]">
    <ui-doughnut-chart
      class="w-full h-auto max-w-full min-[1231px]:w-[300px] min-[1231px]:h-[230px]"
      [showLegends]="true"
      [centerText]="true"
      [showAsValue]="false"
      [legendData]="legendData"
      [activeLabel]="'Total Leaves'"
    ></ui-doughnut-chart>
  </div>

  <div class="flex flex-wrap items-center justify-between gap-2.5 pt-5 px-5 pb-0 -mx-[25px] border-t border-[var(--color-border)]">
    <h3 class="m-0 text-base font-medium text-[var(--color-text-primary)]">Here you can request for a leave</h3>
    <ui-icon-text-button
      text="Request Leave"
      variant="dark"
      iconName="arrow_narrow_right"
      iconPosition="right"
      (buttonClick)="goToApplyLeave()"
    ></ui-icon-text-button>
  </div>
</div>
