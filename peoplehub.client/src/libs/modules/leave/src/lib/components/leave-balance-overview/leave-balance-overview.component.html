<div class="w-full rounded-[20px] py-5 px-[25px]">
  <div class="flex flex-wrap items-center justify-between mb-5">
    <h2 class="m-0 text-sm font-semibold text-[var(--text-color)]">Leave Balance overview</h2>
    <ui-dropdown
      [dropdownValues]="[{value: '2026', isDefault: false, textColor: 'blue', backgroundColor: 'black', isDisabled: false}, {value: '2025', isDefault: true, textColor: 'green', backgroundColor: 'black', isDisabled: false}, {value: '2024', isDefault: true, textColor: 'orange', backgroundColor: 'red', isDisabled: false}]"
      [placeholderText]="'2026'" [textColor]="'#111'" [backgroundColor]="'white'" [activeBackgroundColor]="'#ecf2fd'"
      [borderColor]="'lightgray'" [activeTextColor]="'#4076ff'" [parentFormGroup]="LeaveBalanceOverview">
    </ui-dropdown>
  </div>

  <div class="flex items-center justify-center w-full my-[25px]">
    <ui-doughnut-chart
      class="w-full h-auto max-w-full min-[1231px]:w-[300px] min-[1231px]:h-[230px]"
      [showLegends]="true" [centerText]="true" [showAsValue]="false"
      [legendData]="[{color: '#ffb6c1', value: 40, label: 'Used'}, {color: '#fff09c', value: 30, label: 'Pending'}, {color: '#acefac', value: 30, label: 'Remaining'}]"
      [activeLabel]="'Total Leaves'">
    </ui-doughnut-chart>
  </div>

  <div class="flex flex-wrap items-center justify-between gap-2.5 pt-5 px-5 pb-0 -mx-[25px] border-t border-gray-200">
    <h3 class="m-0 text-base font-medium text-[var(--text-color)]">Here you can request for a leave</h3>
    <ui-text-button  [text]="'Request Leave'" [bgColor]="'#030213'" [color]="'white'" [hoverBGColor]="'#1c1b2b'"
      [hoverColor]="'white'" [borderRadius]="10" [borderColor]="'#030213'" [showBorder]="false"
      (click)="goToApplyLeave()" [iconName]="'arrow_narrow_right'" [iconPosition]="'right'">
    </ui-text-button >
  </div>
</div>
