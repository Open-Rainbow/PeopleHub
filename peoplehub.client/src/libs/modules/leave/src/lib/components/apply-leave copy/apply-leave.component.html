<div class="flex flex-col gap-5 p-3">

  <div class="w-full p-5 rounded-lg shadow-md flex flex-col gap-6">

    <!-- Header -->
    <div class="flex justify-between items-center">
      <div>
        <h2 class="text-[16px] font-semibold text-gray-800">Leaves</h2>
        <h3 class="text-[12px] text-gray-500">Feb 14,2026 -Saturday</h3>
      </div>

      <div class="flex items-center gap-2">

        <ui-dropdown
          class="w-full"
          [dropdownValues]="deptOption"
          [placeholderText]="'2024'"
          [textColor]="'#111'"
          [backgroundColor]="'white'"
          [activeBackgroundColor]="'#ecf2fd'"
          [borderColor]="'lightgray'"
          [activeTextColor]="'#4076ff'"
          (onSelect)="filterByDept($event)"
          [parentFormGroup]="applyLeaveForm">
        </ui-dropdown>

        <ui-text-button
          [text]="'Download Reports'"
          [bgColor]="'#5892e8'"
          [color]="'white'"
          [hoverBGColor]="'#5892e8'"
          [hoverColor]="'white'"
          [borderRadius]="8"
          [borderColor]="'#5892e8'"
          [showBorder]="true"
          [iconName]="'download_rounded'"
          [iconPosition]="'left'"
          [borderStyle]="'solid'">
        </ui-text-button>

      </div>
    </div>


    <!-- Modal -->
    @if(isformOpen){
      <model-popup
        [title]="'Add LeaveRequest'"
        (close)="closeModal()"
        [innerContent]="leaveform">
      </model-popup>
    }

    <ng-template #leaveform>

      <div class="w-full bg-white transition-all duration-500">

        <!-- Start Date -->
        <div class="grid grid-cols-2 gap-3">

          @if(!formConfig.startDate.isHide){
          <ui-calendar
            [parentFormGroup]="applyLeaveForm"
            [id]="formConfig.startDate.id"
            [label]="formConfig.startDate.label"
            [isRequired]="formConfig.startDate.isRequired"
            (dateSelected)="applyLeave.startDate = formatDate($event)">
          </ui-calendar>
          }

          <ui-value-dropdown
            [dropdownValues]="[
              {value:'Full Day',isDefault:true,textColor:'blue',backgroundColor:'#ecf2fd',isDisabled:false},
              {value:'First Half',isDefault:true,textColor:'blue',backgroundColor:'#ecf2fd',isDisabled:false},
              {value:'Second Half',isDefault:true,textColor:'blue',backgroundColor:'#ecf2fd',isDisabled:false}
            ]"
            [placeholderText]="'Full Day'"
            [textColor]="'#111'"
            [backgroundColor]="'white'"
            [activeBackgroundColor]="'#ecf2fd'"
            [borderColor]="'lightgray'"
            [activeTextColor]="'#4076ff'"
            [parentFormGroup]="applyLeaveForm">
          </ui-value-dropdown>

        </div>


        <br>


        <!-- End Date -->
        <div class="grid grid-cols-2 gap-3">

          @if(!formConfig.endDate.isHide){
          <ui-calendar
            [parentFormGroup]="applyLeaveForm"
            [id]="formConfig.endDate.id"
            [label]="formConfig.endDate.label"
            [isRequired]="formConfig.endDate.isRequired"
            (dateSelected)="applyLeave.endDate = formatDate($event)">
          </ui-calendar>
          }

          <ui-value-dropdown
            [dropdownValues]="[
              {value:'Full Day',isDefault:true,textColor:'blue',backgroundColor:'#ecf2fd',isDisabled:false},
              {value:'First Half',isDefault:true,textColor:'blue',backgroundColor:'#ecf2fd',isDisabled:false},
              {value:'Second Half',isDefault:true,textColor:'blue',backgroundColor:'#ecf2fd',isDisabled:false}
            ]"
            [placeholderText]="'Full Day'"
            [textColor]="'#111'"
            [backgroundColor]="'white'"
            [activeBackgroundColor]="'#ecf2fd'"
            [borderColor]="'lightgray'"
            [activeTextColor]="'#4076ff'"
            [parentFormGroup]="applyLeaveForm">
          </ui-value-dropdown>

        </div>


        <br>


        @if(!formConfig.leaveType.isHide){
        <ui-drop-down
          [parentFormGroup]="applyLeaveForm"
          [id]="formConfig.leaveType.id"
          [label]="formConfig.leaveType.label"
          [placeHolder]="formConfig.leaveType.placeHolder"
          [isRequired]="formConfig.leaveType.isRequired"#formConfig.leaveType.isRequired
          [options]="leaveTypeOptions$ | async">
        </ui-drop-down>
        }


        <br>


        @if(!formConfig.reasonforLeave.isHide){
        <ui-text-area
          [parentFormGroup]="applyLeaveForm"
          [id]="formConfig.reasonforLeave.id"
          [label]="formConfig.reasonforLeave.label"
          [Placeholder]="formConfig.reasonforLeave.placeHolder"
          [isRequired]="formConfig.reasonforLeave.isRequired"
          [maxLength]="formConfig.reasonforLeave.maxLength"
          [minLength]="formConfig.reasonforLeave.minLength">
        </ui-text-area>
        }


        <br>


        <!-- Buttons -->
        <div class="flex justify-between items-center">

          <ui-text-button
            [text]="'Clear'"
            [color]="'black'"
            [hoverBGColor]="'white'"
            [borderRadius]="10"
            [borderColor]="'light grey'">
          </ui-text-button>

          <div class="flex gap-3 items-center">

            <ui-text-button
              (click)="submitApplication()"
              [text]="'Submit Leave'"
              [bgColor]="'#aca1f2'"
              [color]="'white'"
              [hoverBGColor]="'#aca1f2'"
              [hoverColor]="'white'"
              [borderRadius]="10"
              [borderColor]="'light grey'"
              [showBorder]="false">
            </ui-text-button>

          </div>

        </div>

      </div>

    </ng-template>

  </div>



  <!-- Overview -->
  <div class="grid grid-cols-2 gap-3">

    <div class="border border-gray-200 rounded-lg">
      <leave-balance-overview></leave-balance-overview>
    </div>

    <div class="border border-gray-200 rounded-lg grid items-center">

      <div class="px-5 pt-5 pb-2 text-[14px]">
        Leaves Taken
      </div>

      <line-chart
        class="px-5 pb-5"
        [labels]="lineLabels"
        [data]="lineData"
        [colors]="lineColors"
        [lineStyles]="lineStyles"
        [visible]="lineVisible"
        [seriesLabels]="lineSeriesLabels"
        [lineThickness]="lineLineThickness"
        [legendShapes]="lineLegendShapes"
        [showDataPoints]="false"
        [yAxisStep]="1"
        [showYAxisLine]="true">
      </line-chart>

    </div>

  </div>


  <leave-balance
    [leaveCards]="LeaveCard"
    (applyLeaveClick)="openFormFromCard($event)">
  </leave-balance>


  <recent-leave-request
    (editLeave)="openEditForm($event)">
  </recent-leave-request>

</div>
