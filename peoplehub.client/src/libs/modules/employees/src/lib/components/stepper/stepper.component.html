<div class="stp flex flex-col w-[260px] max-h-[calc(100dvh-124px)] rounded-2xl overflow-hidden">
  <div class="stp__head shrink-0 px-5 pt-5 pb-4">
    <h3 class="stp__title font-semibold text-[15px] mb-3">Add New Employee</h3>
    <div class="stp__track h-[6px] rounded-full mb-1.5">
      <div
        class="stp__bar h-[6px] rounded-full transition-[width] duration-300 ease-in-out"
        [style.width.%]="progressPercent()"
      ></div>
    </div>
    <p class="stp__meta text-[12px] m-0">{{ completedCount() }} of {{ totalCount() }} steps completed</p>
  </div>

  <ul class="list-none m-0 p-3 flex flex-col gap-0.5 overflow-y-auto">
    @for (step of steps(); let i = $index; track step.route) {
      <li
        class="stp__step flex items-center px-3 py-2 rounded-lg cursor-pointer border-l-[3px] transition-colors duration-150"
        [ngClass]="{
          'is-active': step.status === 'active',
          'is-done': step.status === 'completed',
          'is-error': step.status === 'notComplete'
        }"
        [attr.aria-current]="step.status === 'active' ? 'step' : null"
        (click)="onStepClick(step, i)"
      >
        <div class="flex items-center gap-3 w-full min-w-0">
          <span class="stp__dot flex items-center justify-center w-[26px] h-[26px] rounded-full flex-shrink-0 text-[15px]">
            @if (step.status === 'completed') {
              <ui-icon name="charm:tick"></ui-icon>
            } @else if (step.status === 'notComplete') {
              <ui-icon name="radix-icons:cross-2"></ui-icon>
            } @else {
              <ui-icon [name]="step.icon"></ui-icon>
            }
          </span>
          <span class="text-[13px] font-medium leading-snug min-w-0">{{ step.title }}</span>
        </div>
      </li>
    }
  </ul>
</div>
