<div class="flex items-start gap-6 w-full">
  <ui-toast-stack
    [toasts]="toasts()"
    position="top-right"
    (toastClosed)="removeToast($event)"
  ></ui-toast-stack>

  <!-- Stepper stays pinned while the form scrolls; scrolls on its own if taller than the viewport -->
  <aside class="sticky top-0 self-start shrink-0 max-h-[calc(100dvh-124px)] overflow-y-auto">
    <employees-stepper></employees-stepper>
  </aside>

  <section class="flex-1 min-w-0 flex flex-col gap-4">
    <router-outlet (activate)="onComponentActivate($event)"></router-outlet>

    <employees-button-navigation
      [activeComponent]="currentComponent()"
      (stepSaved)="handleStepSuccess($event)"
      (previewToggle)="togglePreview($event)"
    ></employees-button-navigation>
  </section>
</div>
