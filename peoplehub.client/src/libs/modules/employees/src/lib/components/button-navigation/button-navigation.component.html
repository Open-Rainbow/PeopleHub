<div class="sticky bottom-0 z-10 flex items-center justify-between gap-3 bg-white border border-[#e6e9ef] rounded-xl shadow-[0_-4px_16px_rgba(16,24,40,0.06)] w-full px-5 py-3">
  <ui-icon-text-button
    text="Previous"
    iconName="arrow_left"
    iconPosition="left"
    variant="secondary"
    [disabled]="isFirstStep()"
    (buttonClick)="goPrevious()"
  ></ui-icon-text-button>

  <div class="flex items-center gap-3">
    @if (isLastStep()) {
      <ui-icon-text-button
        text="Preview"
        iconName="eye"
        iconPosition="left"
        variant="secondary"
        (buttonClick)="goPreview()"
      ></ui-icon-text-button>
    }

    <ui-icon-text-button
      [text]="nextButtonLabel()"
      [iconName]="isLastStep() ? 'charm:tick' : 'arrow_right'"
      iconPosition="right"
      variant="primary"
      (buttonClick)="goNext()"
    ></ui-icon-text-button>
  </div>
</div>
