<div
  class="relative inline-block w-full"
  [formGroup]="parentFormGroup"
  [class.border-red-500]="isInvalid"
>
  <button
    type="button"
    #selectedYearRef
    id="selected-year"
    (click)="toggleDropdown($event)"
    class="relative overflow-hidden py-[0.35rem] px-3 text-[0.875rem] min-h-[40px] w-full
           flex items-center justify-between
           border rounded-lg transition-colors duration-200"
    [style.color]="isOpen ? activeTextColor : textColor"
    [style.background-color]="isOpen ? activeBackgroundColor : backgroundColor"
    [style.border-color]="borderColor"
  >
    <div class="flex items-center gap-2">
      <span>{{ selectedYear }}</span>

      @if (showIcon === true) {
        <ui-icon
          name="icon_park_outline_down"
          class="text-[0.875rem] transition-transform duration-200"
          [class.rotate-180]="isOpen">
        </ui-icon>
      }
    </div>

    <span
      #ripple
      class="absolute rounded-full scale-0 pointer-events-none
             w-5 h-5 bg-[rgba(64,118,255,0.35)]">
    </span>
  </button>

  @if (isOpen) {
    <div class="absolute right-0 top-full mt-1.5 z-[1000]
                bg-white border border-gray-200 shadow-lg rounded-lg
                p-1 text-[0.875rem] min-w-full w-max">
      <div class="flex flex-col gap-0.5">
        @for (value of dropdownValues; track value) {
          <button
            type="button"
            class="w-full text-left px-3 py-2 rounded-md whitespace-nowrap transition-colors duration-150 hover:bg-gray-100"
            [class.opacity-30]="value.isDisabled"
            [class.cursor-not-allowed]="value.isDisabled"
            [style.color]="value.value === selectedYear ? activeTextColor : value.textColor"
            [style.backgroundColor]="value.value === selectedYear ? value.backgroundColor : null"
            (click)="selectYear(value.value)"
            [disabled]="value.isDisabled">
            {{ value.value }}
          </button>
        }
      </div>
    </div>
  }
</div>
