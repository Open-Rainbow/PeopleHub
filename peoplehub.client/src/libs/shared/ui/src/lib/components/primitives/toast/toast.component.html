@if (visible) {
  <div
    (mouseenter)="pauseTimer()"
    (mouseleave)="resumeTimer()"
    class="relative z-[9999] flex items-center justify-between
           gap-4 px-4 py-3
           w-fit max-w-[300px]
           rounded-xl overflow-hidden
           transition-all duration-300
           hover:shadow-2xl"
    [class.bg-white]="type === 'normal'"
    [class.text-gray-500]="type === 'normal'"
    [class.bg-yellow-400]="type === 'warning'"
    [class.text-black]="type === 'warning' || type === 'alert'"
    [class.bg-red-500]="type === 'alert'"
    [class.bg-green-600]="type === 'success'"
    [class.text-white]="type === 'success'"
  >

    <div class="flex items-center gap-2 flex-grow">
      <ui-icon class="text-lg" [name]="icon"></ui-icon>

      <div class="text-sm break-words min-w-0">
        <div class="font-bold">{{ title }}</div>
        <div>{{ subtitle }}</div>
      </div>
    </div>

    
    <div
      class="cursor-pointer text-lg flex items-center hover:text-gray-400"
      (click)="closeToast()"
    >
      <ui-icon name="mdi:multiply"></ui-icon>
    </div>

    
    <div class="absolute bottom-0 left-0 h-1 w-full">
      <div
        class="h-full transition-all duration-100"
        [class.bg-gray-500]="type === 'normal'"
        [class.bg-black]="type === 'warning' || type === 'alert'"
        [class.bg-white]="type === 'success'"
        [style.width.%]="progress"
      ></div>
    </div>

  </div>
}
