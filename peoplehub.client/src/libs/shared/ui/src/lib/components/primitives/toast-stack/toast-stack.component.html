<div
  class="fixed z-[9999] flex flex-col gap-3"
  [ngClass]="{
    'top-4 right-4': position === 'top-right',
    'top-4 left-4': position === 'top-left',
    'top-4 left-1/2 -translate-x-1/2': position === 'top-center',
    'bottom-4 right-4': position === 'bottom-right',
    'bottom-4 left-4': position === 'bottom-left',
    'bottom-4 left-1/2 -translate-x-1/2': position === 'bottom-center'
  }"
>
  @for (toast of toasts; track trackById($index, toast)) {
    <ui-toast
      class="transition-all duration-300 ease-in-out"
      [subtitle]="toast.subtitle"
      [type]="toast.type ?? 'normal'"
      [icon]="toast.icon ?? ''"
      [title]="toast.title ?? ''"
      [duration]="toast.duration ?? 30000"
      (closed)="removeToast(toast.id)"
    >
    </ui-toast>
  }
</div>
