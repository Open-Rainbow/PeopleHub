<div
  class="w-full
         px-[15px] py-[10px]
         bg-[#eef3fe]
         rounded-tl-[6px] rounded-tr-[6px]
         flex justify-between items-center
         cursor-pointer
         transition-all duration-[250ms] ease-[ease]
         text-[#222]

         hover:bg-[#3f4af8]
         [&:hover_*]:text-white
         [&:hover_*]:fill-white

         [&.active]:bg-[#3f4af8]
         [&.active_*]:text-white
         [&.active_*]:fill-white"
  [class.active]="isOpen"
  (click)="toggleSection()"
>
  <div class="flex items-center gap-[8px]">
    <span class="text-[14px] font-semibold">
      {{ title }}
    </span>
    <span class="text-[12px]">
      {{ subtitle }}
    </span>
  </div>

  <div class="flex items-center gap-[10px]">
    <span
      class="inline-flex items-center gap-[4px]
             cursor-pointer
             leading-[0.5]
             border-b-[2px] border-transparent
             hover:border-current"
      (click)="onEditClick($event)"
    >
      <ui-icon name="edit"></ui-icon>
      <span>Edit</span>
    </span>

    <ui-icon
      class="text-[20px]
             transition-transform duration-[300ms] ease-[ease]
             [&.rotated]:rotate-180"
      [class.rotated]="isOpen"
      name="material-symbols:keyboard-arrow-down-rounded"
    ></ui-icon>
  </div>
</div>

<div
  #content
  class="max-h-0
         overflow-hidden
         bg-transparent
         rounded-bl-[6px] rounded-br-[6px]
         transition-[transform]
         duration-[350ms]
         [transition-timing-function:cubic-bezier(0.4,0,0.2,1)]"
  [style.maxHeight]="isOpen ? contentHeight + 'px' : '0px'"
>
  <div class="min-h-auto p-[20px] bg-white">
    <ng-container *ngTemplateOutlet="modalTemplate"></ng-container>
  </div>
</div>
