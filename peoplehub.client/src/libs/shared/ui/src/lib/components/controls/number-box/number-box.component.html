<div class="ui-field number-box-container" [formGroup]="activeForm">
  <div
    class="ui-field__box"
    [class.is-focused]="isFocused"
    [class.is-invalid]="isInvalid"
    [class.is-floating]="isFocused || hasValue"
  >
    <input
      type="number"
      class="ui-field__control ui-field__control--suffix"
      [step]="step"
      [id]="id"
      [formControlName]="id"
      [placeholder]="placeholder"
      [attr.aria-invalid]="isInvalid"
      (focus)="onFocus()"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />

    <label [for]="id" class="ui-field__label">
      {{ label }}
      @if (isRequired) {
        <span class="ui-field__required">*</span>
      }
    </label>

    @if (isFocused || hasValue) {
      <span class="ui-field__suffix flex-col !gap-0">
        <button type="button" tabindex="-1" class="ui-field__icon-btn ui-field__icon-btn--sm" aria-label="Increase" (mousedown)="$event.preventDefault()" (click)="increment($event)">
          <ui-icon name="fluent:caret-up-24-filled"></ui-icon>
        </button>
        <button type="button" tabindex="-1" class="ui-field__icon-btn ui-field__icon-btn--sm" aria-label="Decrease" (mousedown)="$event.preventDefault()" (click)="decrement($event)">
          <ui-icon name="fluent:caret-down-24-filled"></ui-icon>
        </button>
      </span>
    }
  </div>
</div>
