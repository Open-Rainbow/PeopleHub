<ol contenteditable="true" (keydown)="onKeydown($event)"
  class="w-full min-h-[200px] p-4 border border-gray-300 rounded-lg outline-none
         focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50
         font-sans leading-relaxed">
  <li class="flex items-start mb-1 line">
    <span class="prefix mr-2">
      @switch (mode) {
        @case ('bullet') {
          <span>•</span>
        }
        @case ('icon') {
          <ui-icon name="home"></ui-icon>
        }
        @case ('number') {
          <span>1.</span>
        }
        @case ('alphabet') {
          <span>a.</span>
        }
      }
    </span>

    <span class="text flex-1">&nbsp;</span>
  </li>
</ol>
