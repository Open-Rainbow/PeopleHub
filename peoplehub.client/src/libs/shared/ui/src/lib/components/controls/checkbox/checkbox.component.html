<div class="checkbox-container flex items-center gap-[10px]" [formGroup]="parentFormGroup">

  @if (isRequired && labelPosition === 'right') {
    <span class="required text-red-500 font-semibold">*</span>
  }

  @if (labelPosition === 'left') {
    <!-- <span
      class="checkbox-label text-sm"
      [class.label-disabled]="!checked"
      [class.label-enabled]="checked"
      (click)="onLabelClick()">
      {{ label }}
    </span> -->
    <span class="text-sm transition-colors duration-200 ease-in-out cursor-pointer" [class.text-[#999]]="!checked"
      [class.text-black]="checked" (click)="onLabelClick()">
      {{ label }}
    </span>
  }

  <div class="checkbox-wrapper flex items-center">
    <!-- <input
      type="checkbox"
      class="checkbox-input"
      [id]="id"
      [checked]="checked"
      [formControlName]="id"
      (change)="onChange($event)" /> -->
      <input type="checkbox" [id]="id" [checked]="checked" [formControlName]="id" (change)="onChange($event)" class="
          appearance-none
          w-5 h-5
          border-2 border-[#999]
          rounded
          bg-white
          cursor-pointer
          relative
          transition-all duration-200 ease-in-out
      
          hover:border-gray-500
          active:scale-95
      
          checked:bg-[var(--checkbox-active-color)]
          checked:border-[var(--checkbox-active-color)]
      
          checked:after:content-['']
          checked:after:absolute
          checked:after:top-[1px]
          checked:after:left-[5px]
          checked:after:w-[6px]
          checked:after:h-[12px]
          checked:after:border-r-[3px]
          checked:after:border-b-[3px]
          checked:after:border-[var(--tick-color)]
          checked:after:rotate-45
        " />
  </div>

  @if (isRequired && labelPosition === 'left') {
    <span class="required text-red-500 font-semibold">*</span>
  }

  @if (labelPosition === 'right') {
    <!-- <span
      class="checkbox-label text-sm"
      [class.label-disabled]="!checked"
      [class.label-enabled]="checked"
      (click)="onLabelClick()">
      {{ label }}
    </span> -->
    <span class="text-sm transition-colors duration-200 ease-in-out cursor-pointer" [class.text-[#999]]="!checked"
      [class.text-black]="checked" (click)="onLabelClick()">
      {{ label }}
    </span>
  }

</div>
