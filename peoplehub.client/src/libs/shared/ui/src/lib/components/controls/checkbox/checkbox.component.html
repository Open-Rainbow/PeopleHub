<div class="checkbox-wrapper" [formGroup]="parentFormGroup">
  
  <!-- Label on left -->
  @if (labelPosition === 'left') {
    <label 
      [for]="id" 
      class="checkbox-label" 
      [class.disabled]="disabled"
      [class.label-clickable]="labelClick"
      (click)="labelClick ? onLabelClick() : null">
      <span class="checkbox-label-text">
        {{ label }}
        @if (isRequired) {
          <span class="required-asterisk">*</span>
        }
      </span>
    </label>
  }

  <!-- Checkbox input (hidden, real checkbox) -->
  <input
    type="checkbox"
    [id]="id"
    [checked]="checked"
    [formControlName]="id"
    (change)="onChange_internal($event)"
    (blur)="handleBlur()"
    class="checkbox-input"
    [class.invalid]="isInvalid"
    aria-role="checkbox"
  />
  
  <!-- Visual checkbox representation -->
  <span class="checkbox-visual"></span>

  <!-- Label on right -->
  @if (labelPosition === 'right') {
    <label 
      [for]="id" 
      class="checkbox-label checkbox-label-right" 
      [class.disabled]="disabled"
      [class.label-clickable]="labelClick"
      (click)="labelClick ? onLabelClick() : null">
      <span class="checkbox-label-text">
        {{ label }}
        @if (isRequired) {
          <span class="required-asterisk">*</span>
        }
      </span>
    </label>
  }

</div>
