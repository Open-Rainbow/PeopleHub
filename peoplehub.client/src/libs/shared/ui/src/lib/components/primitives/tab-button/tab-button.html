
<div class="tab-wrapper">

  @if (showLeftArrow) {
    <div class="tab-scroll-button tab-scroll-button-left">
      <ui-icon-button
        iconName="material-symbols:chevron-left"
        ariaLabel="Scroll tabs left"
        title="Scroll tabs left"
        variant="secondary"
        size="small"
        type="button"
        (buttonClick)="scrollLeft()"
      ></ui-icon-button>
    </div>
  }

  <div
    #tabContainer
    class="tab-container"
    (scroll)="onScroll()"
  >
    @for (tab of tabs; track $index) {
      <button
        type="button"
        class="tab-button"
        [class.active]="activeTab === tab.id"
        [class.inactive]="activeTab !== tab.id"
        (click)="selectTab(tab.id)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  @if (showRightArrow) {
    <div class="tab-scroll-button tab-scroll-button-right">
      <ui-icon-button
        iconName="material-symbols:chevron-right"
        ariaLabel="Scroll tabs right"
        title="Scroll tabs right"
        variant="secondary"
        size="small"
        type="button"
        (buttonClick)="scrollRight()"
      ></ui-icon-button>
    </div>
  }

</div>
