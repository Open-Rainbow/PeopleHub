<div class="flex items-center gap-[2px]" [class.flex-row-reverse]="labelPosition === 'right'">
  @if (label) {
  <span class="text-2xl font-bold leading-none flex items-center" [style.color]="labelColor">
    {{ label }}
  </span>
  <span class="rounded-full shrink-0 inline-block mt-[9px]" [style.backgroundColor]="dotColor"
    [style.width]="dotSize === 'small' ? '8px' : dotSize === 'medium' ? '10px' : '12px'"
    [style.height]="dotSize === 'small' ? '8px' : dotSize === 'medium' ? '10px' : '12px'"></span>

  } @else {
  <span class="rounded-full shrink-0 inline-block mt-[9px]" [style.backgroundColor]="dotColor"
    [style.width]="dotSize === 'small' ? '8px' : dotSize === 'medium' ? '10px' : '12px'"
    [style.height]="dotSize === 'small' ? '8px' : dotSize === 'medium' ? '10px' : '12px'"></span>
  }
</div>
