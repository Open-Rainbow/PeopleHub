<div
  class="chip"
  [class.error]="isInvalid"
  [class.disabled]="disabled"
  [class.chip-size-status]="size === 'status'"
  [style.backgroundColor]="isHovered ? activeBGColor : finalBgColor"
  [style.color]="isHovered ? activeColor : textColor"
  [style.cursor]="disabled ? 'not-allowed' : (usePointerCursor ? 'pointer' : 'default')"
  [style.borderRadius]="borderRadius"
  [style.height]="height"
  [style.width]="width"
  [style.fontSize]="fontSize"
  [style.paddingLeft]="horizontalGap"
  [style.paddingRight]="horizontalGap"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  {{ text }}
</div>
