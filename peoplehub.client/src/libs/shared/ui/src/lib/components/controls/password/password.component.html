<div class="flex w-full flex-col gap-1.5" [formGroup]="parentFormGroup">
  <div
    class="relative h-[36px] w-full rounded-md border px-3 transition-colors duration-200"
    [class.border-red-500]="isInvalid"
    [class.border-blue-600]="isActive && !isInvalid"
    [class.border-slate-300]="!isActive && !isInvalid"
  >
    <input
      [id]="id"
      [type]="passwordVisible ? 'text' : 'password'"
      [formControlName]="id"
      [placeholder]="placeholder"
      [value]="value"
      [attr.minlength]="minLength"
      [attr.maxlength]="maxLength"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      class="peer h-full w-full bg-transparent pr-8 text-[14px] outline-none placeholder-transparent focus:placeholder-gray-400"
    />

    <label
      [for]="id"
      class="pointer-events-none absolute left-2 px-1 transition-all duration-200"
      [class.-top-2]="isActive || hasValue"
      [class.top-1.5]="!(isActive || hasValue)"
      [class.text-xs]="isActive || hasValue"
      [class.text-sm]="!(isActive || hasValue)"
      [class.text-red-500]="isInvalid"
      [class.text-blue-600]="!isInvalid && isActive"
      [class.text-gray-500]="!isInvalid && !isActive"
      [class.bg-white]="isActive || hasValue"
    >
      {{ label }}
      @if (isRequired) {
        <span class="text-red-600">*</span>
      }
    </label>

    <button
      type="button"
      (click)="togglePassword()"
      class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500"
      aria-label="Toggle password visibility"
    >
      <ui-icon [name]="passwordVisible ? 'eye_off' : 'eye'"></ui-icon>
    </button>
  </div>
</div>
