<div class="ui-field password-container" [formGroup]="parentFormGroup">
  <div
    class="ui-field__box"
    [class.is-focused]="isActive"
    [class.is-invalid]="isInvalid"
    [class.is-floating]="isActive || hasValue"
  >
    <input
      class="ui-field__control ui-field__control--suffix"
      [id]="id"
      [type]="passwordVisible ? 'text' : 'password'"
      [formControlName]="id"
      [placeholder]="placeholder"
      [attr.minlength]="minLength"
      [attr.maxlength]="maxLength"
      [attr.aria-invalid]="isInvalid"
      autocomplete="new-password"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    />

    <label [for]="id" class="ui-field__label">
      {{ label }}
      @if (isRequired) {
        <span class="ui-field__required">*</span>
      }
    </label>

    <span class="ui-field__suffix">
      <button
        type="button"
        class="ui-field__icon-btn"
        [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
        (mousedown)="$event.preventDefault()"
        (click)="togglePassword()"
      >
        <ui-icon [name]="passwordVisible ? 'eye_off' : 'eye'"></ui-icon>
      </button>
    </span>
  </div>
</div>
