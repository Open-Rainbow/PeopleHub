<div
  class="flex p-4 rounded-md bg-[var(--banner-color,#DBEAFE)] border-l-4 border-[var(--border-color,#1E3A8A)]"
  [class.border]="showBorder"
  [class.hide-icon]="!showIcon"
  [style.--banner-color]="bannerColor"
  [style.--border-color]="highlighterColor"
  [style.--heading-color]="headingColor"
  [style.--content-color]="contentColor"
  [style.--icon-color]="iconColor"
>

  <ui-icon [name]="'mage:information-circle'"></ui-icon>

  <div class="ml-3">
    <span class="font-semibold text-[var(--heading-color,#1E3A8A)]">{{ heading }}</span>

    @if (!contentInNextLine) {
      <span class="text-[var(--content-color,#374151)]">{{ content }}</span>
    }

    @if (contentInNextLine) {
      <div class="mt-1">
        <span class="text-[var(--content-color,#374151)]">{{ content }}</span>
      </div>
    }
  </div>
</div>
