
 
 

 
 

 
 
<div class="flex items-center justify-between gap-2">
 
  
   @if(labelPosition === 'left' || labelPosition === 'both'){
    <span
      class="text-sm transition-colors duration-200 cursor-pointer"
      [class.text-black]="!checked || (labelPosition === 'left' && checked && !manualToggle && isDualLabelMode)"
      [class.text-gray-400]="checked && !(labelPosition === 'left' && !manualToggle && isDualLabelMode)"
      (click)="!toggleOnlyMode && onLabelClick(false)"
    >
      {{ dynamicLeftLabel }}
    </span>
   }
  
 
  
  <label class="relative inline-flex items-center cursor-pointer">
 
    
    <input
      type="checkbox"
      [checked]="checked"
      (change)="onChange($event)"
      class="peer sr-only"
    />
 
    
    <div
      class="
        w-[34px] h-[18px]
        bg-gray-300
        rounded-full
        transition-colors duration-300
        peer-checked:bg-[var(--toggle-active-color)]
      "
    ></div>
 
    
    <div
      class="
        absolute
        left-[2px] top-[50%]
        -translate-y-1/2
        w-[14px] h-[14px]
        rounded-full
        bg-black
        transition-all duration-300
        peer-checked:translate-x-[16px]
        peer-checked:bg-white
      "
    ></div>
 
  </label>
 
  
  @if(labelPosition === 'right' || labelPosition === 'both'){
    <span
      class="text-sm transition-colors duration-200 cursor-pointer"
      [class.text-black]="checked || (labelPosition === 'right' && !checked && !manualToggle && isDualLabelMode)"
      [class.text-gray-400]="!checked && !(labelPosition === 'right' && !manualToggle && isDualLabelMode)"
      (click)="!toggleOnlyMode && onLabelClick(true)"
      >
      {{ dynamicRightLabel }}
    </span>
  }
  
 
</div>
