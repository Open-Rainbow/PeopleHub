<div class="toggle-container">
  @if (labelPosition === "left" || labelPosition === "both") {
    <span
      class="toggle-label"
      [class.text-black]="
        !checked ||
        (labelPosition === 'left' &&
          checked &&
          !hasSeparateOnOffLabels)
      "
      [class.text-gray-400]="
        checked &&
        !(labelPosition === 'left' && !hasSeparateOnOffLabels)
      "
      (click)="canToggleFromLabel && onLabelClick(false)"
    >
      {{ leftLabelText }}
      @if (isRequired && labelPosition !== 'both') {
        <span class="required-asterisk">*</span>
      }
    </span>
  }

  <label class="toggle-wrapper" [ngClass]="'size-' + size">
    <input
      type="checkbox"
      [checked]="checked"
      (change)="onToggleChange($event)"
      class="toggle-input"
    />

    <div class="toggle-track"></div>

    <div class="toggle-knob"></div>
  </label>

  @if (labelPosition === "right" || labelPosition === "both") {
    <span
      class="toggle-label"
      [class.text-black]="
        checked ||
        (labelPosition === 'right' &&
          !checked &&
          !hasSeparateOnOffLabels)
      "
      [class.text-gray-400]="
        !checked &&
        !(labelPosition === 'right' && !hasSeparateOnOffLabels)
      "
      (click)="canToggleFromLabel && onLabelClick(true)"
    >
      {{ rightLabelText }}
      @if (isRequired) {
        <span class="required-asterisk">*</span>
      }
    </span>
  }
</div>
