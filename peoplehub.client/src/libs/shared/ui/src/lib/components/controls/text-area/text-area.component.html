<div class="ui-field textarea-container" [formGroup]="parentFormGroup">
  <div
    class="ui-field__box is-multiline"
    [class.is-focused]="isFocused"
    [class.is-invalid]="isInvalid"
    [class.is-floating]="isFocused || hasValue"
  >
    <textarea
      class="ui-field__control"
      [id]="id"
      [formControl]="control"
      [placeholder]="placeholder"
      [attr.maxlength]="maxLength"
      [attr.aria-invalid]="isInvalid"
      [rows]="rows"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    ></textarea>

    <label class="ui-field__label" [for]="id">
      {{ label }}
      @if (isRequired) {
        <span class="ui-field__required">*</span>
      }
    </label>
  </div>

  <!-- hint row is always reserved so focusing never shifts/resizes layout -->
  @if (showCharCount) {
    <p
      class="ui-field__hint textarea-hint"
      [class.is-hidden]="!(isFocused || hasValue)"
      [class.ui-field__error]="isInvalid"
    >
      {{ currentCharCount }} of {{ maxLength }} characters left
    </p>
  }
</div>
