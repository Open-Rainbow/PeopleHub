<div class="textarea-container" [attr.data-width-text]="label || placeholder || ''" [formGroup]="parentFormGroup">
  <div class="input-wrapper">
    <div
      #textareaInput
      class="textarea-input"
      [class.border-gray]="!isFocused && !isInvalid"
      [class.border-blue]="isFocused && !isInvalid"
      [class.border-red]="isInvalid"
      [style.--border-color]="borderColor">
      
      <textarea
        #textareaField
        class="textarea-field"
        [id]="id"
        [formControl]="control"
        [placeholder]="placeholder"
        [attr.maxlength]="maxLength"
        [rows]="rows"
        (input)="onInput($event)"
        (focus)="onFocus()"
        (blur)="onBlur()">
      </textarea>

      <label
        class="textarea-label"
        [for]="id"
        [class.floating]="isFocused || hasValue"
        [class.blue]="isFocused && !isInvalid"
        [class.gray]="!isFocused && !isInvalid"
        [class.red]="isInvalid">
        {{ label }}
        @if (isRequired) {
          <span class="required-asterisk">*</span>
        }
      </label>
    </div>

    @if (showCharCount && (isFocused || hasValue)) {
      <p
        class="char-count"
        [class.char-count-active]="isFocused || hasValue"
        [class.char-count-invalid]="isInvalid">
        {{ currentCharCount }} of {{ maxLength }} characters left
      </p>
    }
  </div>
</div>
