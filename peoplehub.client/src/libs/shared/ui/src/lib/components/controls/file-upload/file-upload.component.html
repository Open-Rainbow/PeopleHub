<div class="file-upload-container">
  <div class="input-wrapper">
    <button
      [id]="triggerId"
      type="button"
      class="file-upload-input inputBoxHeight"
      [disabled]="isDisabled"
      [class.border-gray]="!isFocused && !isFileDialogOpen && !isInvalid"
      [class.border-blue]="(isFocused || isFileDialogOpen) && !isInvalid"
      [class.border-red]="isInvalid"
      [attr.aria-required]="isRequired"
      [attr.aria-invalid]="isInvalid"
      [attr.aria-describedby]="helperId"
      [attr.aria-labelledby]="id + '-label ' + triggerId"
      (click)="onAreaClick()"
      (focus)="onFocus()"
      (blur)="onBlur()"
    >
      <!-- Placeholder only shows once the label has floated up, same as ui-text-box -->
      <span class="file-upload-value" [class.placeholder]="!hasValue">{{
        hasValue || isFocused || isFileDialogOpen ? displayValue : ''
      }}</span>
      <ui-icon
        [name]="
          hasValue
            ? 'material-symbols:close-rounded'
            : 'material-symbols:upload-rounded'
        "
        class="upload-icon"
        [class.actionable]="hasValue && !isDisabled"
        [attr.aria-label]="hasValue ? 'Remove selected file' : 'Upload file'"
        (click)="hasValue && !isDisabled ? clearFiles($event) : null"
      ></ui-icon>
    </button>

    <input
      #fileInput
      [id]="inputId"
      type="file"
      class="native-file-input"
      [attr.accept]="accept"
      [attr.multiple]="multiple ? '' : null"
      [disabled]="isDisabled"
      (change)="onFileSelected($event)"
      (click)="$event.stopPropagation()"
    />

    <label
      [id]="id + '-label'"
      [attr.for]="triggerId"
      class="input-label"
      [class.floating]="isFocused || isFileDialogOpen || hasValue"
      [class.blue]="(isFocused || isFileDialogOpen) && !isInvalid"
      [class.gray]="!(isFocused || isFileDialogOpen) && !isInvalid"
      [class.red]="isInvalid"
    >
      {{ label }}
      @if (isRequired) {
        <span class="required-asterisk">*</span>
      }
    </label>
  </div>

  @if (isInvalid) {
    <span [id]="helperId" class="helper-text error-text">
      {{ errorNote }}
    </span>
  }
</div>
