<div class="ui-field file-upload-container">
  <div
    class="ui-field__box"
    [class.is-focused]="isFocused || isFileDialogOpen"
    [class.is-invalid]="isInvalid"
    [class.is-disabled]="isDisabled"
    [class.is-floating]="isFocused || isFileDialogOpen || hasValue"
  >
    <button
      [id]="triggerId"
      type="button"
      class="ui-field__control ui-field__control--suffix"
      [disabled]="isDisabled"
      [attr.aria-required]="isRequired"
      [attr.aria-invalid]="isInvalid"
      [attr.aria-describedby]="helperId"
      [attr.aria-labelledby]="id + '-label ' + triggerId"
      (click)="onAreaClick()"
      (focus)="onFocus()"
      (blur)="onBlur()"
    >
      <span class="ui-field__value" [class.is-placeholder]="!hasValue">{{ displayValue }}</span>
    </button>

    <input
      #fileInput
      [id]="inputId"
      type="file"
      class="native-file-input"
      [attr.accept]="accept"
      [attr.multiple]="multiple ? '' : null"
      [disabled]="isDisabled"
      (change)="onFileSelected($event)"
      (click)="$event.stopPropagation()"
    />

    <label [id]="id + '-label'" [attr.for]="triggerId" class="ui-field__label">
      {{ label }}
      @if (isRequired) {
        <span class="ui-field__required">*</span>
      }
    </label>

    <span class="ui-field__suffix">
      @if (hasValue && !isDisabled) {
        <button type="button" class="ui-field__icon-btn" aria-label="Remove selected file" (click)="clearFiles($event)">
          <ui-icon name="material-symbols:close-rounded"></ui-icon>
        </button>
      } @else {
        <ui-icon name="material-symbols:upload-rounded" aria-hidden="true"></ui-icon>
      }
    </span>
  </div>

  @if (isInvalid) {
    <p [id]="helperId" class="ui-field__error">{{ errorNote }}</p>
  }
</div>
