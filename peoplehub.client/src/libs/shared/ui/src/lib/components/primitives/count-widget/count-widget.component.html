<div class="w-full h-full border-2 border-gray-300 rounded-lg p-2 flex justify-center items-center overflow-hidden"
  [style.border-color]="showBorder ? borderColor : 'transparent'"
  [style.background-color]="backgroundColor">

  @if (labelPosition === 'top' || labelPosition === 'bottom') {
    <div
    class="flex items-center justify-center w-full h-full gap-2"
    [class.flex-col]="labelPosition === 'top'"
    [class.flex-col-reverse]="labelPosition === 'bottom'">
      <span [style.color]="labelColor" [style.fontSize]="labelSize" class="font-[Inter] leading-none whitespace-nowrap text-center text-[clamp(8px,2vw,22px)]">{{ label }}</span>
      <span [style.color]="valueColor" [style.fontSize]="valueSize" class="font-[Inter] leading-none whitespace-nowrap text-center text-[clamp(8px,2vw,22px)] font-semibold">{{ value }}</span>
    </div>
  }

  @if (labelPosition === 'before' || labelPosition === 'after') {
    <div
    class="flex items-center justify-center w-full h-full gap-2"
    [class.flex-row]="labelPosition === 'before'"
    [class.flex-row-reverse]="labelPosition === 'after'">
      <span [style.color]="labelColor" [style.fontSize]="labelSize" class="font-[Inter] leading-none whitespace-nowrap text-center text-[clamp(8px,2vw,22px)]">{{ label }}</span>
      <span [style.color]="valueColor" [style.fontSize]="valueSize" class="font-[Inter] leading-none whitespace-nowrap text-center text-[clamp(8px,2vw,22px)] font-semibold">{{ value }}</span>
    </div>
  }

</div>
