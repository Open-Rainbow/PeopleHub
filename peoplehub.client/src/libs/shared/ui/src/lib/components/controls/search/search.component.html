<div class="ui-field search-container" [formGroup]="parentFormGroup">
  <div
    class="ui-field__box is-floating"
    [class.is-invalid]="isInvalid"
    [class.is-borderless]="!showBorder"
    [style.--color-primary]="borderColor || null"
  >
    @if (showIcon) {
      <span class="ui-field__prefix">
        <ui-icon name="iconamoon:search"></ui-icon>
      </span>
    }

    <input
      type="text"
      class="ui-field__control ui-field__control--suffix"
      [class.ui-field__control--prefix]="showIcon"
      [formControl]="searchControl"
      [placeholder]="placeholderText"
      autocomplete="off"
      (focus)="suggestionsVisible = !!searchControl.value && filteredSuggestions.length > 0"
      (blur)="hideSuggestionsWithDelay()"
    />

    @if (searchControl.value) {
      <span class="ui-field__suffix">
        <button type="button" class="ui-field__icon-btn" aria-label="Clear search" (mousedown)="$event.preventDefault()" (click)="clearSearch()">
          <ui-icon name="cross_2"></ui-icon>
        </button>
      </span>
    }

    @if (suggestionsVisible) {
      <ul class="ui-field__popup">
        @for (suggestion of filteredSuggestions; track suggestion) {
          <li class="ui-field__option" (mousedown)="selectSuggestion(suggestion)">{{ suggestion }}</li>
        } @empty {
          <li class="ui-field__option is-empty">No such data is found</li>
        }
      </ul>
    }
  </div>
</div>
