<div class="dropdown-container" [attr.data-width-text]="label || placeholder || ''">
  <div class="input-wrapper">
    <button
      [id]="triggerId"
      type="button"
      class="dropdown-input inputBoxHeight"
      [disabled]="isDisabled"
      [class.border-gray]="!isOpen && !isInvalid"
      [class.border-blue]="isOpen && !isInvalid"
      [class.border-red]="isInvalid"
      [attr.aria-required]="isRequired"
      [attr.aria-invalid]="isInvalid"
      [attr.aria-expanded]="isOpen"
      [attr.aria-haspopup]="'listbox'"
      [attr.aria-controls]="listboxId"
      [attr.aria-labelledby]="labelId + ' ' + valueId"
      (click)="toggleDropdown($event)"
      (blur)="onBlur()"
      (keydown)="onTriggerKeydown($event)">
      <span [id]="valueId" class="dropdown-value" [class.placeholder]="!hasValue">{{ displayText }}</span>
    </button>

    <label
      [id]="labelId"
      [attr.for]="triggerId"
      class="input-label"
      [class.floating]="isOpen || hasValue"
      [class.blue]="isOpen && !isInvalid"
      [class.gray]="!isOpen && !isInvalid"
      [class.red]="isInvalid">
      {{ label }}
      @if (isRequired) {
        <span class="required-asterisk">*</span>
      }
    </label>

    <ui-icon [name]="'arrow_down'" class="dropdown-icon" [class.rotated]="isOpen"></ui-icon>

    @if (isOpen) {
      <div class="dropdown-popup" [class.open-up]="isOpenUp">
        <ul [id]="listboxId" class="custom-dropdown-list" role="listbox" tabindex="-1">
          @if (optionLength === 0) {
            <li class="dropdown-empty" aria-disabled="true">No options available</li>
          }

          @if (optionLength > 0) {
            @for (option of options; track trackByOption($index, option)) {
              <li
                role="option"
                tabindex="0"
                [class.selected]="selectedValue === option.value"
                [attr.aria-selected]="selectedValue === option.value"
                (click)="selectOption(option)"
                (keydown)="onOptionKeydown($event, option)">
                {{ option.name }}
              </li>
            }
          }

          @if (draggable) {
            <hr class="resize-hr" />
          }
        </ul>
      </div>
    }
  </div>

  @if (isInvalid) {
    <p class="dropdown-error">Please select a valid option.</p>
  }
</div>
