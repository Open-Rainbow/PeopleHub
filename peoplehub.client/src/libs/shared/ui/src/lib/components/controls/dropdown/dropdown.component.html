<div class="ui-field dropdown-container">
  <div
    class="ui-field__box"
    [class.is-open]="isOpen"
    [class.is-invalid]="isInvalid"
    [class.is-disabled]="isDisabled"
    [class.is-floating]="isOpen || hasValue"
  >
    <button
      [id]="triggerId"
      type="button"
      class="ui-field__control ui-field__control--suffix"
      [disabled]="isDisabled"
      [attr.aria-required]="isRequired"
      [attr.aria-invalid]="isInvalid"
      [attr.aria-expanded]="isOpen"
      [attr.aria-haspopup]="'listbox'"
      [attr.aria-controls]="listboxId"
      [attr.aria-labelledby]="labelId + ' ' + valueId"
      (click)="toggleDropdown($event)"
      (blur)="onBlur()"
      (keydown)="onTriggerKeydown($event)"
    >
      <span [id]="valueId" class="ui-field__value" [class.is-placeholder]="!hasValue">{{ displayText }}</span>
    </button>

    <label [id]="labelId" [attr.for]="triggerId" class="ui-field__label">
      {{ label }}
      @if (isRequired) {
        <span class="ui-field__required">*</span>
      }
    </label>

    <span class="ui-field__suffix">
      <ui-icon name="arrow_down" class="ui-field__chevron"></ui-icon>
    </span>

    @if (isOpen) {
      <ul
        [id]="listboxId"
        class="ui-field__popup custom-dropdown-list"
        [class.open-up]="isOpenUp"
        role="listbox"
        tabindex="-1"
      >
        @if (optionLength === 0) {
          <li class="ui-field__option is-empty" aria-disabled="true">No options available</li>
        } @else {
          @for (option of options; track trackByOption($index, option)) {
            <li
              role="option"
              tabindex="0"
              class="ui-field__option"
              [class.is-selected]="selectedValue === option.value"
              [attr.aria-selected]="selectedValue === option.value"
              (click)="selectOption(option)"
              (keydown)="onOptionKeydown($event, option)"
            >
              {{ option.name }}
            </li>
          }
        }
      </ul>
    }
  </div>

  @if (isInvalid) {
    <p class="ui-field__error">Please select a valid option.</p>
  }
</div>
