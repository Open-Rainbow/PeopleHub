<button 
  class="p-2.5 shadow-[1px_2px_2px_rgba(0,0,0,0.1)] relative h-[36px] overflow-hidden flex items-center justify-center px-4 transition-transform duration-200 active:scale-95 gap-[3px]"
  [disabled]="disable" [class.opacity-50]="disable" [class.cursor-not-allowed]="disable" [class.border]="showBorder"
  [class.error]="isInvalid" [ngStyle]="{
    backgroundColor: disable
      ? '#e5e7eb'
      : isHovered ? hoverBGColor : bgColor,
    color: disable
      ? '#9ca3af'
      : isHovered ? hoverColor : color,
    borderRadius: borderRadius + 'px',
    borderColor: borderColor,
    width: isexpand ? '100%' : 'auto',
  }"
  (mouseenter)="!disable && (isHovered = true)"
  (mouseleave)="!disable && (isHovered = false)"
  (click)="!disable && createRipple($event)">
    <!-- {{ text }} -->
  
  <!-- @if(iconName && (iconPosition === 'left' || iconPosition === 'both')){ -->
    @if(iconName){
    <ng-container>
      <span class="flex items-center">
        <ui-icon class="flex items-center !text-[16px]" [name]="iconName || ''"></ui-icon>
      </span>
    </ng-container>
  }
</button>
