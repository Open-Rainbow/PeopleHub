<button 
  class="shadow-[1px_2px_2px_rgba(0,0,0,0.1)] relative h-[36px] overflow-hidden flex items-center justify-center px-4 transition-transform duration-200 active:scale-95 gap-[3px]"
  [disabled]="disable" [class.opacity-50]="disable" [class.cursor-not-allowed]="disable" 
  [class.error]="isInvalid" [ngStyle]="{
  backgroundColor: disable
    ? '#e5e7eb'
    : isHovered ? hoverBGColor : bgColor,
  color: disable
    ? '#9ca3af'
    : isHovered ? hoverColor : color,
  borderRadius: borderRadius + 'px',
  borderColor: borderColor,
  borderStyle: borderStyle,
  borderWidth: showBorder ? '1px' : '0px',
  width: isexpand ? '100%' : 'auto',
  paddingTop: '4px',
  paddingBottom: '4px'
}"
  (mouseenter)="!disable && (isHovered = true)"
  (mouseleave)="!disable && (isHovered = false)"
  (click)="!disable && createRipple($event)">

  @if(iconName && (iconPosition === 'left' || iconPosition === 'both')){
    <ng-container>
      <span class="flex items-center">
        <ui-icon class="flex items-center text-lg" [name]="iconName || ''"></ui-icon>
      </span>
    </ng-container>
  }
  
  @if(text){
    <span class="flex items-center leading-none text-[12px]">
      {{ text }}
    </span>
  }

  @if(iconName && (iconPosition === 'right' || iconPosition === 'both')){
    <ng-container>
      <span class="flex items-center">
        <ui-icon class="flex items-center text-[12px]" [name]="iconName || ''"></ui-icon>
      </span>
    </ng-container>
  }
</button>
