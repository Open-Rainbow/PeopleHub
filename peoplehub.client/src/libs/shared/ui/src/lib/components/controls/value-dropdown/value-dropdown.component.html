<div
  class="relative inline-block w-full"
  [formGroup]="parentFormGroup"
  [class.border-red-500]="isInvalid"
>

  
  <button
    type="button"
    #selectedYearRef
    id="selected-year"
    (click)="toggleDropdown($event)"
    class="relative overflow-hidden py-[0.35rem] px-[0.7rem] text-[0.8125rem] min-h-[36px] w-full
           flex items-left justify-between
           border rounded-lg transition-colors duration-200"
    [ngStyle]="{
      color: isOpen ? activeTextColor : textColor,
      backgroundColor: isOpen ? activeBackgroundColor : backgroundColor,
      borderColor: borderColor
    }"
  >
    <div class="flex items-center gap-2">
      <span>{{ selectedYear }}</span>

      @if (showIcon === true) {
      <ui-icon
        name="icon_park_outline_down"
        class="text-[0.8125rem] transition-transform duration-200"
        [ngClass]="{ 'rotate-180': isOpen }">
      </ui-icon>

      }
    </div>


    
    <span
      #ripple
      class="absolute rounded-full scale-0 pointer-events-none
             w-5 h-5 bg-[rgba(64,118,255,0.35)]">
    </span>
  </button>

  
  @if(isOpen){
    <div class="absolute right-0 top-full mt-2 z-50
               bg-white shadow-lg rounded-lg
               py-[0.35rem] px-[0.7rem] text-[0.8125rem] min-h-[36px] min-w-full w-max p-2">
      <div class="flex flex-col gap-1">
    
        @for (value of dropdownValues; track value) {
        <div>
          <button type="button" class="w-full text-left px-2 py-1
                      rounded-md whitespace-nowrap
                      transition-all duration-200
                      hover:bg-gray-100" [class.opacity-30]="value.isDisabled"
            [class.cursor-not-allowed]="value.isDisabled" [ngStyle]="{
                  color: value.value === selectedYear 
                    ? activeTextColor 
                    : value.textColor
                }" [style.backgroundColor]="
                  value.value === selectedYear 
                    ? value.backgroundColor 
                    : null
                " (click)="selectYear(value.value)" [disabled]="value.isDisabled">
            {{ value.value }}
          </button>
    
        </div>
        }
    
      </div>
    </div>
  }
  

</div>
