<div 
  class="relative inline-flex items-center justify-center"
  (mouseenter)="!disabled && (isHovered = true)"
  (mouseleave)="!disabled && (isHovered = false)"
>
  <ui-icon-button
    [iconName]="iconName"
    [variant]="variant"
    [size]="size"
    [disabled]="disabled"
  ></ui-icon-button>

  @if(isHovered){
    <div [class]="positionClasses" [style.background-color]="popupBgColor" [style.color]="popupTxtColor"
      role="tooltip">
      {{ description }}
      <div [class]="arrowClasses" [style.background-color]="popupBgColor">
      </div>
    </div>
  }
</div>
