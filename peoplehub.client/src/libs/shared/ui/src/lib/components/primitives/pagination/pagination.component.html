<div class="ui-pagination" [style.--ui-pagination-bg]="backgroundColor">
  <div class="ui-pagination__meta">
    @if (isShowingEntries) {
      <p class="ui-pagination__summary">
        Items {{ startEntry }}-{{ endEntry }} of {{ totalItems }}
      </p>
    }

    @if (isDropCount) {
      <div class="ui-pagination__chunk-size">
        <p class="ui-pagination__label">Per page:</p>
        <div class="ui-pagination__control ui-pagination__control--compact">
          <ui-dropdown
            [label]="''"
            [(ngModel)]="pageSize"
            [options]="pageSizeOptions$ | async"
            [isRequired]="false"
            (selectedChange)="onPageSizeChange($event)">
          </ui-dropdown>
        </div>
      </div>
    }
  </div>

  <div class="ui-pagination__actions">
    @if (isGoto) {
      <div class="ui-pagination__goto">
        <p class="ui-pagination__label">Page:</p>
        <div class="ui-pagination__control ui-pagination__control--number">
          <ui-number-box
            [label]="''"
            [isRequired]="false"
            [placeholder]="currentPage.toString()"
            (numberBox)="onGoToInput($event)">
          </ui-number-box>
        </div>
        <p class="ui-pagination__hint">/ {{ totalPages }}</p>
        <div [class]="isGoDisabled ? 'ui-pagination__go-btn-wrapper ui-pagination__go-btn-wrapper--disabled' : 'ui-pagination__go-btn-wrapper'">
          <ui-text-button
            [text]="'Go'"
            [variant]="'info'"
            [size]="'small'"
            [isExpanded]="false"
            [disabled]="isGoDisabled"
            (click)="goToPage(goToNumber)">
          </ui-text-button>
        </div>
      </div>
    }

    @if (isPagination && shouldShowPagination) {
      <div class="ui-pagination__page-nav">
        <ui-button-group
          [items]="paginationItems"
          [variant]="'outlined'"
          [size]="'sm'"
          [selectionMode]="'single'"
          [selectedValues]="[currentPage.toString()]"
          [ariaLabel]="'Page navigation'"
          (buttonClick)="onPaginationClick($event)">
        </ui-button-group>
      </div>
    }
  </div>
</div>
