<div class="ui-field textbox-container" [formGroup]="parentFormGroup">
  <div
    class="ui-field__box"
    [class.is-focused]="isFocused"
    [class.is-invalid]="isInvalid"
    [class.is-floating]="isFocused || hasValue"
    [class.is-borderless]="!showBorder"
  >
    <input
      type="text"
      class="ui-field__control"
      [id]="id"
      [formControlName]="id"
      [placeholder]="placeholder ?? ''"
      [attr.maxlength]="maxLength"
      [attr.aria-invalid]="isInvalid"
      [readonly]="isReadOnly"
      [tabindex]="tabindex"
      (focus)="onFocus()"
      (blur)="onBlur($event)"
      (input)="onInput($event)"
    />

    <label class="ui-field__label" [for]="id">
      {{ label }}
      @if (isRequired) {
        <span class="ui-field__required">*</span>
      }
    </label>
  </div>

  @if (showCharCount && (isFocused || hasValue)) {
    <p class="ui-field__hint" [class.ui-field__error]="isInvalid">
      {{ currentCharCount }} of {{ maxLength }} characters left
    </p>
  }
</div>
