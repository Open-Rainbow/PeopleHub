<div class="relative w-full" [formGroup]="parentFormGroup">

  <input type="text" [id]="id" [formControlName]="id" [placeholder]="placeHolder" [attr.maxlength]="maxLength"
    [readonly]="isReadOnly" [tabindex]="tabindex" [ngStyle]="getInputStyle()" [class.error]="isInvalid" [value]="value"
    class="peer inputBoxHeight px-3  pb-1 text-[14px] text-gray-800 outline-none transition bg-white
           placeholder-transparent 
           focus:placeholder-gray-400
           border border-red-300
           " (focus)="onFocus()" (blur)="onBlur($event)" (input)="onInput($event)" />

  <label [for]="id" class="absolute left-3 bg-white px-1 transition-all duration-200 ease-out pointer-events-none 
          text-gray-500 font-medium whitespace-nowrap
          -top-2 text-xs 
          peer-placeholder-shown:top-1.5
          peer-placeholder-shown:text-sm
          peer-placeholder-shown:text-gray-500        
          peer-focus:-top-2
          peer-focus:text-xs
          ">
    {{ label }}
    @if (isRequired) { <span class="required">*</span> }
  </label>

  @if (showCharCount ) {
  <p [ngStyle]="{ color: isInvalid ? '#dc2626' : '#000000' }"
    class="text-[11px] font-medium text-left mt-1 transition-opacity duration-200" [class.opacity-100]="shouldShowCount"
    [class.opacity-0]="!shouldShowCount">
    {{ currentCharCount }} of {{ maxLength }} characters left
  </p>
  }
</div>
