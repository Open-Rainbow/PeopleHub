<div class="textbox-container" [formGroup]="parentFormGroup">
  <div class="input-wrapper">
    <div
      class="textbox-input"
      [class.border-gray]="!isFocused && !isInvalid"
      [class.border-blue]="isFocused && !isInvalid"
      [class.border-red]="isInvalid"
      [class.no-border]="!showBorder"
    >
      <input
        type="text"
        class="textbox-field"
        [class.has-value]="hasValue"
        [id]="id"
        [formControlName]="id"
        [placeholder]="isFocused || hasValue ? (placeholder ?? '') : ''"
        [attr.maxlength]="maxLength"
        [readonly]="isReadOnly"
        [tabindex]="tabindex"
        (focus)="onFocus()"
        (blur)="onBlur($event)"
        (input)="onInput($event)"
      />

      <label
        class="textbox-label"
        [for]="id"
        [class.floating]="isFocused || hasValue"
        [class.blue]="isFocused && !isInvalid"
        [class.gray]="!isFocused && !isInvalid"
        [class.red]="isInvalid"
      >
        {{ label }}
        @if (isRequired) {
          <span class="required-asterisk">*</span>
        }
      </label>
    </div>

    @if (showCharCount && (isFocused || hasValue)) {
      <p
        class="char-count"
        [class.char-count-active]="isFocused || hasValue"
        [class.char-count-invalid]="isInvalid"
      >
        {{ currentCharCount }} of {{ maxLength }} characters left
      </p>
    }
  </div>
</div>
